
name: Atualizar GitHub Stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ArthurVequi&show_icons=true&theme=radical&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Gerar linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ArthurVequi&layout=compact&theme=radical&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Salvar imagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar estatísticas do GitHub"
            git push
          fi
